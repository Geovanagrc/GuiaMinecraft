<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Guia</title>
    <style>
        body{
            background-color:#0d2c07 ;
        }
    </style>
  <style>
    ul{
        list-style-type:  none;
        padding: 8px;
            overflow: hidden;
        background-color: black;
    }
    li{
        float: left;
    }
    li a{
        display:flex;
        -ms-flex-align: center;
        color: white;
        text-align: center;
        padding: 30px;
        text-decoration: none;
        font-size: larger;
    }
    li a :hover{
        background-color: rgba(211, 198, 198, 0.941);
    }
</style>
</head>
<body>
    <ul>
        <li><a href="Home">Home</a></li>
        <li><a href="O que">O que é?</a></li>
        <li><a href="Itens">Itens</a></li>
        <li><a href="Sobrevivência">Sobrevivência</a></li>
    </ul>
    
</body>
</html>
